name: GARP Daily Screener

on:
  schedule:
    # 20:05 UTC lun-ven = 22:05 ora italiana (estate) / 21:05 (inverno),
    # dopo la chiusura di Wall Street (20:00 UTC in estate).
    # Nota: GitHub può ritardare i cron di 5-15 minuti.
    - cron: "5 20 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "results/**"   # i commit dei risultati non ri-avviano lo screening

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet yfinance pandas lxml

      - name: Run GARP screener
        run: python garp_screener.py

      - name: Run Moonshot screener
        run: python moonshot_screener.py

      - name: Commit results
        run: |
          git config user.name "garp-bot"
          git config user.email "actions@github.com"
          git add results/ results-moonshot/
          git diff --cached --quiet || git commit -m "Screening GARP+Moonshot $(date -u +%F)"
          git push
